name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/validate-*.sh'
      - 'website/src/config/stats.ts'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/validate-*.sh'
      - 'website/src/config/stats.ts'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate skills
        run: bash scripts/validate-skills.sh
      - name: Validate agents
        run: bash scripts/validate-agents.sh
      - name: Validate structure
        run: bash scripts/validate-structure.sh
      - name: Validate stats
        run: bash scripts/validate-stats.sh

      # The four checks above are structural — they read frontmatter, manifests
      # and counts. They cannot tell whether a script works. Until these three
      # suites ran here, a test fixture sat red on main for weeks and two fatal
      # defects in .ai/lib shipped in a release (see #197, #198).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test — dx-core libs (node)
        run: node --test plugins/dx-core/data/lib/fetch-raw-story.test.js
      - name: Test — dx-simple helper scripts
        run: bash plugins/dx-core/skills/dx-simple/tests/run-tests.sh
      - name: Test — dx-discover-repos helper scripts
        run: bash plugins/dx-hub/skills/dx-discover-repos/tests/run-tests.sh
