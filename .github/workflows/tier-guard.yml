name: Tier guard

# Consumers install with `/plugin marketplace add easingthemes/dx-aem-flow`, which
# resolves plugins through relative paths in .claude-plugin/marketplace.json with no
# git ref pinned — so they track `main`, not the released tag. A `docs:` commit that
# edits a SKILL.md reaches real projects with no version bump and nothing to notice.
# Commit type is not a safety valve; the path is. See CONTRIBUTING.md § 1.
#
# This job reports the tier of every PR, and ENFORCES it on PRs labelled `tier-a` —
# the label outside contributors work under. With it, a contributor cannot break a
# consumer project by accident, which is what makes the work safe to hand out.
#
# The classification itself lives in scripts/check-tier.sh so that this workflow and a
# contributor's local check can never disagree. That script has its own suite
# (scripts/check-tier.test.sh, mutation-tested), run by validate.yml's discovery.

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` matter: adding the tier-a label to an already-open PR must
    # re-run the check, or the label could be applied to a diff that never passed it.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # check-tier.sh diffs against the base, so the base commit must be present.
          # A shallow default checkout does not have it and the script exits 2.
          fetch-depth: 0

      - name: Classify the diff
        id: classify
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          set +e
          out=$(bash scripts/check-tier.sh --base "origin/${{ github.base_ref }}" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          {
            echo "## Tier guard"
            echo
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # A usage error (exit 2) is a broken workflow, not a verdict — fail loudly.
          if [ "$code" = "2" ]; then
            echo "::error::check-tier.sh could not classify the diff"
            exit 1
          fi

      - name: Enforce on tier-a PRs
        if: contains(github.event.pull_request.labels.*.name, 'tier-a')
        run: |
          if [ "${{ steps.classify.outputs.code }}" != "0" ]; then
            echo "::error::This PR is labelled 'tier-a' but changes files that ship to every consumer project."
            echo ""
            echo "Either:"
            echo "  - drop the shipped paths from the diff, or"
            echo "  - remove the 'tier-a' label and ask a maintainer to validate it"
            echo "    against a real consumer project."
            echo ""
            echo "See CONTRIBUTING.md § 1 for the path table."
            exit 1
          fi
          echo "Tier A confirmed — nothing in this diff is loaded by a consumer's agent."
