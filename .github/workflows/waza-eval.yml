name: Waza Eval

on:
  push:
    branches: [main]
    paths:
      - 'evals/**'
      - 'plugins/**/skills/**/SKILL.md'
      - '.github/workflows/waza-eval.yml'
  pull_request:
    branches: [main]
    paths:
      - 'evals/**'
      - 'plugins/**/skills/**/SKILL.md'
  workflow_dispatch:
    inputs:
      executor:
        description: 'Waza executor (mock | copilot-sdk)'
        type: choice
        default: mock
        options:
          - mock
          - copilot-sdk

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install waza
        run: |
          curl -fsSL https://raw.githubusercontent.com/microsoft/waza/main/install.sh | bash
          echo "$HOME/.waza/bin" >> "$GITHUB_PATH"

      - name: Show waza version
        run: waza version

      # Mock executor returns dummy output that won't satisfy real graders,
      # so we use --skip-graders here. This still validates: eval YAML schema,
      # fixture loading, task dispatch, and grader config parsing.
      # Live runs (workflow_dispatch with executor=copilot-sdk) drop the flag.
      - name: Run dx-ticket-analyze eval
        env:
          WAZA_EXECUTOR: ${{ github.event.inputs.executor || 'mock' }}
        run: |
          mkdir -p results
          if [ "$WAZA_EXECUTOR" = "mock" ]; then
            waza run evals/dx-ticket-analyze/eval.yaml \
              --executor mock \
              --skip-graders \
              --output results/dx-ticket-analyze.json \
              --no-update-check
          else
            waza run evals/dx-ticket-analyze/eval.yaml \
              --executor "$WAZA_EXECUTOR" \
              --output results/dx-ticket-analyze.json \
              --no-update-check
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waza-eval-results
          path: results/
          retention-days: 14
