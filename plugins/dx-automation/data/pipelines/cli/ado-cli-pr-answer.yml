trigger: none
pr: none

# Claude Agent SDK pipeline — fully autonomous PR Answer via /dx-pr-answer (TODO #149).
#
# Triggered by the pr-router Lambda on PR comment events, filtered to PRs whose
# author is in MY_IDENTITIES. Runs headless with DX_PIPELINE_MODE=true so
# /dx-pr-answer takes its non-interactive branch: it replies to EVERY open
# reviewer thread (agree-will-fix, question, AND disagree — evidence-backed,
# confidence-gated), and for accepted patches / agree-will-fix it applies the
# change, runs a lint + compile gate, then commits + pushes to update the PR.
# No human in the loop, no AskUserQuestion.
#
# In CI the git identity is the service account, so /dx-pr-answer verifies PR
# ownership against MY_IDENTITIES (not git config user.email). The disagree
# confidence bar defaults to 80; override per-pipeline with DX_DISAGREE_CONFIDENCE
# (env) or overrides.pr-answer.disagree-confidence-threshold (config).

parameters:
  - name: prUrl
    displayName: "PR URL (full ADO PR URL)"
    type: string
  - name: dryRun
    displayName: "Dry run (draft answers, don't post replies)"
    type: boolean
    default: false
  - name: eventId
    displayName: "Webhook event ID (for tracing)"
    type: string
    default: ""

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
    path: s

  - bash: |
      git clone --depth 1 --branch main \
        https://github.com/easingthemes/dx-aem-flow.git \
        "$(Pipeline.Workspace)/dx-aem-flow"
    displayName: "Fetch dx-aem-flow plugins from GitHub"

  - bash: |
      npm install -g @anthropic-ai/claude-code
      npm install --no-save @anthropic-ai/claude-agent-sdk
    displayName: "Install Claude Code + Agent SDK"
    workingDirectory: $(Build.SourcesDirectory)
  - bash: |
      # ADO renders boolean params as "True"/"False"; the skill wants "true".
      export DX_DRY_RUN=$(printf '%s' "$DX_DRY_RUN" | tr '[:upper:]' '[:lower:]')
      export PLUGIN_BASE_DIR="$(Pipeline.Workspace)/dx-aem-flow/plugins"

      PROMPT="/dx-pr-answer ${{ parameters.prUrl }}"
      echo "prompt: $PROMPT (dry_run=$DX_DRY_RUN)"
      node .ai/automation/scripts/pipeline-agent.js "$PROMPT"
    displayName: "AI PR Answer"
    env:
      ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
      ADO_MCP_AUTH_TOKEN: $(ADO_PAT)
      MY_IDENTITIES: $(MY_IDENTITIES)
      SOURCE_REPO_NAME: $(Build.Repository.Name)
      DX_PIPELINE_MODE: "true"
      DX_DRY_RUN: "${{ parameters.dryRun }}"
      DX_HOOK_PROFILE: "minimal"
      CI: "true"
      TIMEOUT_MINUTES: $(TIMEOUT_MINUTES)
      # Apply + lint + compile + commit/push is heavier than draft-only; give it
      # room. The wrapper's TIMEOUT_MINUTES is the outer backstop.
      MAX_TURNS: "80"
      # mvn/npm enable the lint + compile gate before any commit; git for
      # commit/push (persistCredentials above). ADO posting/vote tools are
      # auto-allowed by the runner via the mcp__ado__* wildcard (ADO_MCP_AUTH_TOKEN set).
      ALLOWED_TOOLS: "Skill,Read,Write,Edit,Glob,Grep,Bash(git *),Bash(mvn *),Bash(npm *),Agent"
    timeoutInMinutes: 45
