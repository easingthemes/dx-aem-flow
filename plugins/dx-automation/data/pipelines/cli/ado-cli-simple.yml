trigger: none
pr: none

# Claude Agent SDK pipeline — SimpleAgent via /dx-simple skill.
# Triggered by Lambda webhook on work item tag KAI-SIMPLE-AUTOMATION.
# Authoring + code split with 9 confidence gates. ~45 min step budget.

parameters:
  - name: workItemId
    displayName: "ADO Work Item ID"
    type: string
  - name: dryRun
    displayName: "Dry run (analyze + plan only, no JCR writes, no code edits, no PR)"
    type: boolean
    default: false
  - name: eventId
    displayName: "Webhook event ID (for tracing)"
    type: string
    default: ""

variables:
  - name: CHROME_DEVTOOLS_MCP_VERSION
    value: "1.1.1"
  - name: AEM_MCP_VERSION
    value: "1.6.2"

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
    path: s

  - bash: |
      git clone --depth 1 --branch main \
        https://github.com/easingthemes/dx-aem-flow.git \
        "$(Pipeline.Workspace)/dx-aem-flow"
    displayName: "Fetch dx-aem-flow plugins from GitHub"

  - task: Cache@2
    inputs:
      key: 'chrome-devtools-mcp | "$(Agent.OS)" | "$(CHROME_DEVTOOLS_MCP_VERSION)"'
      path: '$(HOME)/.cache/chrome-devtools-mcp'
    displayName: "Cache Chrome download"

  - bash: |
      npm install -g @anthropic-ai/claude-code
      npm install --no-save @anthropic-ai/claude-agent-sdk
    displayName: "Install Claude Code + Agent SDK"
    workingDirectory: $(Build.SourcesDirectory)

  - bash: |
      set -e
      SRC="$(Pipeline.Workspace)/dx-aem-flow/plugins/dx-automation/data/mcp/simple-mcp.json"
      DST="$(Build.SourcesDirectory)/.mcp.json"
      if [ -f "$DST" ]; then
        # Merge: pipeline servers (AEM, chrome-devtools-mcp) WIN, but any
        # other servers already declared in the consumer repo (e.g., ADO,
        # Atlassian) are preserved. Backup first for forensics.
        cp "$DST" "$DST.pre-simple-bak"
        jq -s '.[0] * .[1]' "$DST" "$SRC" > "$DST.merged"
        mv "$DST.merged" "$DST"
        echo "Merged $SRC into existing $DST (backup at $DST.pre-simple-bak)"
      else
        cp "$SRC" "$DST"
        echo "Installed fresh $DST from $SRC"
      fi
    displayName: "Install pipeline MCP overrides (merge)"

  - bash: |
      set -e
      # Pre-flight: AEM QA must be reachable from this agent. If it's not
      # (corp firewall, VPN-only), fail fast with a clear message rather
      # than burning agent turns on MCP ToolSearch loops.
      echo "Probing AEM QA at $AEM_QA_URL ..."
      HTTP=$(curl -fsS -o /dev/null -w '%{http_code}' \
                  -u "$AEM_QA_USER:$AEM_QA_PASSWORD" \
                  --max-time 15 \
                  "$AEM_QA_URL/system/console/bundles.json" || echo "000")
      if [ "$HTTP" != "200" ]; then
        echo "ERROR: AEM QA not reachable (HTTP $HTTP from ubuntu-latest agent)" >&2
        echo "  url: $AEM_QA_URL" >&2
        echo "  Likely causes: corp firewall blocks Microsoft-hosted agents, or QA is VPN-only." >&2
        echo "  Fix: use a self-hosted ADO agent in the corp network." >&2
        exit 1
      fi
      echo "OK: AEM QA reachable"
    displayName: "Pre-flight: AEM QA reachability"
    env:
      AEM_QA_URL: $(AEM_QA_URL)
      AEM_QA_USER: $(AEM_QA_USER)
      AEM_QA_PASSWORD: $(AEM_QA_PASSWORD)

  - bash: |
      set -e
      # Pre-flight: spin up AEM MCP briefly to confirm the npx package +
      # argv format work. Without this, a broken MCP launch wastes the
      # agent's first ~6 turns on ToolSearch.
      echo "Smoke-testing aem-mcp-server@${AEM_MCP_VERSION} ..."
      timeout 30s npx -y "aem-mcp-server@${AEM_MCP_VERSION}" --help >/dev/null 2>&1 || {
        echo "ERROR: aem-mcp-server@${AEM_MCP_VERSION} --help failed — check version pin or npm registry" >&2
        exit 1
      }
      echo "Smoke-testing chrome-devtools-mcp@${CHROME_DEVTOOLS_MCP_VERSION} ..."
      timeout 30s npx -y "chrome-devtools-mcp@${CHROME_DEVTOOLS_MCP_VERSION}" --help >/dev/null 2>&1 || {
        echo "ERROR: chrome-devtools-mcp@${CHROME_DEVTOOLS_MCP_VERSION} --help failed" >&2
        exit 1
      }
      echo "OK: MCP packages resolvable"
    displayName: "Pre-flight: MCP health check"

  - bash: |
      PROMPT="/dx-simple ${{ parameters.workItemId }}"
      if [ "${{ parameters.dryRun }}" = "True" ]; then
        PROMPT="$PROMPT (dry run — analyze only, do not write or commit)"
      fi
      export PLUGIN_BASE_DIR="$(Pipeline.Workspace)/dx-aem-flow/plugins"
      echo "prompt: $PROMPT"
      node .ai/automation/scripts/pipeline-agent.js "$PROMPT"
    displayName: "AI SimpleAgent"
    env:
      ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
      ADO_MCP_AUTH_TOKEN: $(ADO_PAT)
      AEM_QA_URL: $(AEM_QA_URL)
      AEM_QA_USER: $(AEM_QA_USER)
      AEM_QA_PASSWORD: $(AEM_QA_PASSWORD)
      DX_PIPELINE_MODE: "true"
      DX_HOOK_PROFILE: "minimal"
      CI: "true"
      CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: "1"
      # Coordinator + 3 parallel research subagents + up to 10 JCR writes +
      # visual verify + diff review + PR creation. 30 and then 60 were both
      # too tight — a real run hit the cap mid-Phase-4 (compile), stranding the
      # edits before the report/ADO comment could be posted. 200 gives headroom
      # for the full pipeline incl. retries; the wall-clock cap (timeoutInMinutes
      # below + the wrapper's TIMEOUT_MINUTES) is the real backstop.
      MAX_TURNS: "200"
      ALLOWED_TOOLS: >-
        Skill,Read,Write,Edit,Glob,Grep,Agent,
        Bash(git *),Bash(mvn *),Bash(npm *),
        mcp__plugin_dx-aem_AEM__getNodeContent,
        mcp__plugin_dx-aem_AEM__scanPageComponents,
        mcp__plugin_dx-aem_AEM__getPageProperties,
        mcp__plugin_dx-aem_AEM__listChildren,
        mcp__plugin_dx-aem_AEM__updateComponent,
        mcp__plugin_dx-aem_AEM__activatePage,
        mcp__plugin_dx-aem_chrome-devtools-mcp__navigate_page,
        mcp__plugin_dx-aem_chrome-devtools-mcp__take_screenshot,
        mcp__plugin_dx-aem_chrome-devtools-mcp__take_snapshot,
        mcp__plugin_dx-aem_chrome-devtools-mcp__evaluate_script,
        mcp__plugin_dx-aem_chrome-devtools-mcp__wait_for,
        mcp__ado__wit_add_work_item_comment,
        mcp__ado__wit_get_work_item,
        mcp__ado__repo_create_pull_request
    # ~11s/turn observed; 200 turns can run ~35-40 min. Give the Azure step
    # enough wall-clock to actually reach MAX_TURNS rather than being killed at
    # the step boundary first. The wrapper's own TIMEOUT_MINUTES (default 60)
    # remains the outer backstop.
    timeoutInMinutes: 45

  - bash: |
      if [ -d "$(Build.SourcesDirectory)/.ai/specs" ]; then
        echo "Uploading spec artifacts..."
        find "$(Build.SourcesDirectory)/.ai/specs" -name "*.png" -o -name "*.md" -o -name "*.json" | head -50
      fi
    displayName: "List spec artifacts (for retention)"
    condition: always()

  # Fallback ADO comment. The /dx-simple skill posts its own comment at Phase 7
  # (success) and on the ABORT path (gate failure), touching the flag below when
  # it does. If the agent was killed before it could post (MAX_TURNS, timeout,
  # ToolSearch-loop, crash) or a pre-flight step failed, the flag is absent and
  # this step posts a short failure note so the ticket never goes silent.
  - bash: |
      set -e
      FLAG="$(Build.SourcesDirectory)/.ai/run-context/ado-comment-posted.flag"
      if [ -f "$FLAG" ]; then
        echo "Skill already posted an ADO comment — skipping fallback."
        exit 0
      fi
      ORG_URL="$(System.CollectionUri)"
      PROJECT="$(System.TeamProject)"
      WID="${{ parameters.workItemId }}"
      RUN_URL="${ORG_URL}${PROJECT}/_build/results?buildId=$(Build.BuildId)"
      TEXT="SimpleAgent did not finish cleanly — it likely hit the turn/time limit or errored before posting its report. No changes were committed or merged. Pipeline run: ${RUN_URL}"
      BODY=$(jq -n --arg t "$TEXT" '{text:$t}')
      curl -fsS -X POST \
        -u ":$ADO_PAT" \
        -H "Content-Type: application/json" \
        -d "$BODY" \
        "${ORG_URL}${PROJECT}/_apis/wit/workItems/${WID}/comments?api-version=7.1-preview.3" >/dev/null
      echo "Posted fallback failure comment to work item ${WID}."
    displayName: "Post fallback ADO comment (on failure)"
    condition: failed()
    env:
      ADO_PAT: $(ADO_PAT)
