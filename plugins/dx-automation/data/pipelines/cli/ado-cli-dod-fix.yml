trigger: none
pr: none

# Claude Agent SDK pipeline — DoD Fix via /dx-req-dod skill.
# Chained trigger: Lambda fires this after DoD check reports failures.

parameters:
  - name: workItemId
    displayName: "ADO Work Item ID"
    type: string
  - name: dryRun
    displayName: "Dry run (analyze only, don't apply fixes or create tasks)"
    type: boolean
    default: false
  - name: eventId
    displayName: "Webhook event ID (for tracing)"
    type: string
    default: ""
  - name: targetRepo
    displayName: "Target repo alias (set by KAI-HUB; empty = direct single-repo mode)"
    type: string
    default: ""
  - name: commentId
    displayName: "Triggering comment ID (for dedup/tracing; set by KAI-HUB)"
    type: string
    default: ""

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
    path: s

  - bash: |
      git clone --depth 1 --branch main \
        https://github.com/easingthemes/dx-aem-flow.git \
        "$(Pipeline.Workspace)/dx-aem-flow"
    displayName: "Fetch dx-aem-flow plugins from GitHub"

  - bash: |
      set -e
      # Resolve execution mode + TARGET_DIR (dual-mode).
      #  - targetRepo set   -> HUB MODE: clone the named repo from the registry.
      #  - targetRepo empty -> DIRECT MODE: operate on checkout: self (today's behavior).
      TARGET_REPO="${{ parameters.targetRepo }}"
      if [ -n "$TARGET_REPO" ]; then
        REG="$(Build.SourcesDirectory)/.ai/automation/registries/repos.json"
        [ -f "$REG" ] || { echo "ERROR: hub mode (targetRepo=$TARGET_REPO) but registry missing: $REG" >&2; exit 1; }
        RJSON=$(jq -e --arg a "$TARGET_REPO" '.[$a]' "$REG") || {
          echo "ERROR: targetRepo '$TARGET_REPO' not found in $REG" >&2; exit 1; }
        AUTH_URL=$(echo "$RJSON" | jq -r '.cloneUrl' | sed "s#https://#https://pat:${ADO_PAT}@#")
        BRANCH=$(echo "$RJSON" | jq -r '.defaultBranch')
        git clone --branch "$BRANCH" "$AUTH_URL" "$(Pipeline.Workspace)/target"
        echo "##vso[task.setvariable variable=TARGET_DIR]$(Pipeline.Workspace)/target"
        echo "Hub mode: cloned target repo '$TARGET_REPO' (branch $BRANCH)"
      else
        echo "##vso[task.setvariable variable=TARGET_DIR]$(Build.SourcesDirectory)"
        echo "Direct mode: operating on checkout: self (single-repo)"
      fi
    displayName: "Resolve execution mode (clone target in hub mode)"
    env:
      ADO_PAT: $(ADO_PAT)

  - bash: |
      npm install -g @anthropic-ai/claude-code
      npm install --no-save @anthropic-ai/claude-agent-sdk
    displayName: "Install Claude Code + Agent SDK"
    workingDirectory: $(Build.SourcesDirectory)
  - bash: |
      PROMPT="/dx-req-dod ${{ parameters.workItemId }}"
      if [ "${{ parameters.dryRun }}" = "True" ]; then
        PROMPT="$PROMPT (dry run — analyze and draft fixes but do NOT apply changes, create tasks, or push code)"
      fi

      export PLUGIN_BASE_DIR="$(Pipeline.Workspace)/dx-aem-flow/plugins"

      echo "prompt: $PROMPT"
      # pipeline-agent.js lives in the AI/automation repo (checkout: self); run it
      # with cwd = TARGET_DIR. Direct mode TARGET_DIR == Build.SourcesDirectory.
      node "$(Build.SourcesDirectory)/.ai/automation/scripts/pipeline-agent.js" "$PROMPT"
    displayName: "AI DoD Fix"
    workingDirectory: $(TARGET_DIR)
    env:
      ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
      ADO_MCP_AUTH_TOKEN: $(ADO_PAT)
      TIMEOUT_MINUTES: $(TIMEOUT_MINUTES)
      DX_PIPELINE_MODE: "true"
      MAX_TURNS: "40"
      ALLOWED_TOOLS: "Skill,Read,Write,Edit,Glob,Grep,Bash(git *),Agent"
    timeoutInMinutes: 20
