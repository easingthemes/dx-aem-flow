# dx-simple ROUTER pipeline (TODO #142).
# Triggered by the @kai-simple service hook in a multi-platform project.
# Resolves the ticket's declared platform/brand/scope to child dx-simple
# pipelines and queues them via the ADO REST API, then exits (fire-and-forget;
# each child owns its own #141 recovery state).
resources:
  webhooks:
    - webhook: kai-simple
      connection: kai-simple-trigger-sc

parameters:
  - name: workItemId
    type: string
  - name: eventId
    type: string
    default: ""

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      set -euo pipefail
      git clone --depth 1 --branch main "$DX_MARKETPLACE_URL" /tmp/dx
      RAW="/tmp/story.md"
      WID="${{ parameters.workItemId }}"
      curl -s -u ":$ADO_PAT" \
        "${ADO_ORG_URL}/_apis/wit/workitems/${WID}?api-version=7.1" \
        | jq -r '.fields["System.Description"] // ""' > "$RAW"
      bash /tmp/dx/plugins/dx-core/skills/dx-simple/scripts/parse-simple-block.sh "$RAW" /tmp/block.yaml || true
      DISPATCH=$(bash /tmp/dx/plugins/dx-core/skills/dx-simple/scripts/route-targets.sh \
        /tmp/block.yaml ".ai/config.yaml" "$CROSS_REPO_PIPELINE_MAP")
      echo "Dispatch plan: $DISPATCH"
      echo "$DISPATCH" > /tmp/dispatch.json
    displayName: "Resolve target repos"
    env:
      ADO_PAT: $(ADO_PAT)
      ADO_ORG_URL: $(ADO_ORG_URL)
      DX_MARKETPLACE_URL: $(DX_MARKETPLACE_URL)
      CROSS_REPO_PIPELINE_MAP: $(CROSS_REPO_PIPELINE_MAP)

  - bash: |
      set -euo pipefail
      WID="${{ parameters.workItemId }}"
      PROJECT="$(System.TeamProject)"
      jq -c '.[]' /tmp/dispatch.json | while read -r row; do
        PIPELINE_ID=$(echo "$row" | jq -r '.pipelineId')
        REPO=$(echo "$row" | jq -r '.repo')
        API_URL="${ADO_ORG_URL}/$(printf '%s' "$PROJECT" | jq -sRr @uri)/_apis/pipelines/${PIPELINE_ID}/runs?api-version=7.1-preview.1"
        BODY=$(jq -n --arg wid "$WID" --arg eid "${{ parameters.eventId }}" \
          '{templateParameters: {workItemId: $wid, eventId: $eid}}')
        echo "##[section]Queuing dx-simple in $REPO (pipeline $PIPELINE_ID)"
        HTTP=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "$API_URL" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" -d "$BODY")
        if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
          echo "queued run $(jq -r '.id // "?"' /tmp/resp.json)"
        else
          echo "##[warning]queue failed for $REPO: HTTP $HTTP"; cat /tmp/resp.json || true
        fi
      done
    displayName: "Queue child dx-simple pipelines"
    condition: not(canceled())
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      ADO_ORG_URL: $(ADO_ORG_URL)

# NOTE: cross-ADO-project targets — if child repos live in a different ADO project
# than the router, replace $(System.TeamProject) in API_URL with the per-repo
# ado-project (carry it through route-targets.sh output as an adoProject field and
# read it here). Left as a documented extension; the common single-project case
# works with $(System.TeamProject).
