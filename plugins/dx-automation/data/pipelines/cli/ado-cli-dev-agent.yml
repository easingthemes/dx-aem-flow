trigger: none
pr: none

# Claude Agent SDK pipeline — DevAgent via /dx-agent-all skill.
# Triggered by Lambda webhook on work item tag KAI-DEV-AUTOMATION.
# Full autonomous development: requirements > plan > implement > test > review > commit > PR.

parameters:
  - name: workItemId
    displayName: "ADO Work Item ID"
    type: string
  - name: dryRun
    displayName: "Dry run (analyze and plan only, don't create branches, push code, or open PRs)"
    type: boolean
    default: false
  - name: eventId
    displayName: "Webhook event ID (for tracing)"
    type: string
    default: ""

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
    path: s

  - bash: |
      git clone --depth 1 --branch main \
        https://github.com/easingthemes/dx-aem-flow.git \
        "$(Pipeline.Workspace)/dx-aem-flow"
    displayName: "Fetch dx-aem-flow plugins from GitHub"

  - bash: |
      npm install -g @anthropic-ai/claude-code
      npm install --no-save @anthropic-ai/claude-agent-sdk
    displayName: "Install Claude Code + Agent SDK"
    workingDirectory: $(Build.SourcesDirectory)
  - bash: |
      PROMPT="/dx-agent-all ${{ parameters.workItemId }} autonomous"
      if [ "${{ parameters.dryRun }}" = "True" ]; then
        PROMPT="$PROMPT (dry run — analyze, plan, and generate requirements only. Do NOT create branches, write code, push, or open PRs)"
      fi

      export PLUGIN_BASE_DIR="$(Pipeline.Workspace)/dx-aem-flow/plugins"

      echo "prompt: $PROMPT"
      node .ai/automation/scripts/pipeline-agent.js "$PROMPT"
    displayName: "AI DevAgent"
    env:
      ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
      ADO_MCP_AUTH_TOKEN: $(ADO_PAT)
      TIMEOUT_MINUTES: $(TIMEOUT_MINUTES)
      FIGMA_PERSONAL_ACCESS_TOKEN: $(FIGMA_PERSONAL_ACCESS_TOKEN)
      DX_PIPELINE_MODE: "true"
      MAX_TURNS: "80"
      ALLOWED_TOOLS: "Skill,Read,Write,Edit,Glob,Grep,Bash(git *),Agent"
    timeoutInMinutes: 60
