trigger: none
pr: none

# Claude Agent SDK pipeline — QA Agent via /aem-qa skill.
# Triggered by Lambda webhook on work item tag KAI-QA-AUTOMATION.
# Requires headless Chrome for browser-based QA verification.

parameters:
  - name: workItemId
    displayName: "ADO Work Item ID"
    type: string
  - name: dryRun
    displayName: "Dry run (analyze only, don't create Bug tickets)"
    type: boolean
    default: false
  - name: eventId
    displayName: "Webhook event ID (for tracing)"
    type: string
    default: ""

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 1
    path: s

  - bash: |
      git clone --depth 1 --branch main \
        https://github.com/easingthemes/dx-aem-flow.git \
        "$(Pipeline.Workspace)/dx-aem-flow"
    displayName: "Fetch dx-aem-flow plugins from GitHub"

  - bash: |
      # Playwright MCP (@playwright/mcp) drives its OWN Chromium — install it (and OS deps)
      # before the agent. (chrome-devtools-mcp's system-Chrome + CHROME_PATH approach no longer applies.)
      npx -y playwright install --with-deps chromium
    displayName: "Install Playwright Chromium + deps"

  - bash: |
      npm install -g @anthropic-ai/claude-code
      npm install --no-save @anthropic-ai/claude-agent-sdk
    displayName: "Install Claude Code + Agent SDK"
    workingDirectory: $(Build.SourcesDirectory)
  - bash: |
      PROMPT="/aem-qa ${{ parameters.workItemId }}"
      if [ "${{ parameters.dryRun }}" = "True" ]; then
        PROMPT="$PROMPT (dry run — check rendering and capture screenshots but do NOT create Bug tickets in ADO)"
      fi

      export PLUGIN_BASE_DIR="$(Pipeline.Workspace)/dx-aem-flow/plugins"

      echo "prompt: $PROMPT"
      node .ai/automation/scripts/pipeline-agent.js "$PROMPT"
    displayName: "AI QA Agent"
    env:
      ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
      ADO_MCP_AUTH_TOKEN: $(ADO_PAT)
      TIMEOUT_MINUTES: $(TIMEOUT_MINUTES)
      AEM_AUTHOR_URL: $(AEM_AUTHOR_URL)
      AEM_USER: $(AEM_USER)
      AEM_PASS: $(AEM_PASS)
      MAX_TURNS: "40"
      ALLOWED_TOOLS: "Skill,Read,Write,Glob,Grep,Bash,Agent"
    timeoutInMinutes: 30
