# waza project config — read by `waza run` / `waza check`
# Tells waza where to find SKILL.md files referenced from eval.yaml `skill:` keys.
project: dx-aem-flow

skill_paths:
  - plugins/dx-core/skills
  - plugins/dx-hub/skills
  - plugins/dx-aem/skills
  - plugins/dx-automation/skills

defaults:
  executor: mock
  model: claude-haiku-4-5-20251001
  trials_per_task: 3
  timeout_seconds: 180
  parallel: true
